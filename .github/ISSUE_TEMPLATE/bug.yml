name: Bug or rough edge
description: Something wrong, confusing or broken (setup, filtering, documents, reports)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "This issue is public: replace names, companies and amounts with placeholders, and never paste API keys."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command or request, and its output
      render: text
  - type: input
    id: version
    attributes:
      label: Skill version, OS, install type
      placeholder: "0.2.2, macOS 15, plugin / git clone"
    validations:
      required: true
