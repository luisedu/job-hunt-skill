name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        env:
          JOB_HUNT_OFFLINE: "1"
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Byte-compile scripts
        run: python -m py_compile skill/job-hunt/scripts/*.py
      - name: Lint (pyflakes errors only)
        run: pip install --quiet ruff==0.8.6 && ruff check .
      - name: Security lint (bandit; known items documented in .bandit.yml)
        run: pip install --quiet bandit==1.8.0 && bandit -q -r skill -c .bandit.yml
